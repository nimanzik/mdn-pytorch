[project]
name = "mdn-pytorch"
version = "0.1.0"
description = "Mixture Density Network (MDN) implemented in PyTorch"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Nima Nooshiri", email = "nima.nooshiri@gmail.com" }
]
maintainers = [
    { name = "Nima Nooshiri", email = "nima.nooshiri@gmail.com" }
]
dependencies = [
    "lightning>=2.5.6",
    "numpy>=2.3.4",
    "polars>=1.35.2",
    "pydantic>=2.12.4",
    "safetensors>=0.8.0",
    "scikit-learn>=1.7.2",
    "torch>=2.9.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"


[dependency-groups]
build = [
    "twine>=7.0.0",
]
quality = [
    "ruff>=0.16.6",
    "ty>=0.0.79",
]
test = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning:torch.autograd.graph",
]

[tool.uv]
exclude-newer = "7 days"
